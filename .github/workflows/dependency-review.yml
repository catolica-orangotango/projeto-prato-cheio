name: Revisão de dependências

# Barra o PR que adicionar uma dependência com vulnerabilidade conhecida,
# antes que ela chegue à main. Complementa o Dependabot, que só avisa depois.
on:
  pull_request:

permissions:
  contents: read

jobs:
  revisao-de-dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
