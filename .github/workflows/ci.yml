name: CI

# Roda a cada push e a cada Pull Request.
# O PR só deve ser integrado com este check verde.
on:
  push:
    branches: [main]
  pull_request:

# Por padrão o GITHUB_TOKEN só lê o código.
permissions:
  contents: read

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para comentar a cobertura de testes no PR.
      pull-requests: write

    # ---------------------------------------------------------------------
    # UNIDADE 3 — quando migrarem para PostgreSQL, descomentem este bloco e
    # a variável DATABASE_URL abaixo. Na Unidade 1 o banco é SQLite em
    # memória, então o CI não precisa de serviço nenhum.
    #
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: pratocheio
    #       POSTGRES_PASSWORD: pratocheio
    #       POSTGRES_DB: pratocheio
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd="pg_isready -U pratocheio"
    #       --health-interval=5s
    #       --health-timeout=3s
    #       --health-retries=10
    #
    # env:
    #   DATABASE_URL: postgres://pratocheio:pratocheio@localhost:5432/pratocheio
    # ---------------------------------------------------------------------

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar o lint
        run: npm run lint

      - name: Verificar a formatação
        run: npm run formatar:checar

      - name: Rodar os testes (com cobertura)
        run: npm run test:cobertura

      # Comenta no PR a cobertura total e a dos arquivos alterados no PR.
      # Também escreve o resumo na página do run.
      - name: Publicar a cobertura no PR
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

      # Relatório HTML navegável (linhas sem teste), para baixar no run.
      - name: Guardar o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: coverage/
          retention-days: 14

      - name: Verificar se a aplicação sobe
        run: |
          npm start &
          sleep 3
          curl --fail http://localhost:3000/api/saude
