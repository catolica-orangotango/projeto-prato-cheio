<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    :root {
      --azul: #005293;
      --azul-escuro: #003b6b;
      --azul-claro: #e8f1fa;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #222;
    }
    header {
      background: var(--azul);
      color: #ffffff;
      padding: 1rem 1.2rem;
    }
    header h1 { margin: 0; font-size: 1.3rem; }
    main { max-width: 40rem; margin: 0 auto; padding: 1.2rem; }
    h2 { color: var(--azul); font-size: 1.1rem; border-bottom: 2px solid var(--azul-claro); padding-bottom: .4rem; }
    fieldset {
      border: 1px solid var(--azul-claro);
      background: var(--azul-claro);
      border-radius: .5rem;
      margin-bottom: 1.2rem;
    }
    legend { color: var(--azul-escuro); font-weight: bold; padding: 0 .4rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; color: var(--azul-escuro); }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    input {
      border: 1px solid #b9d3ea;
      border-radius: .4rem;
      background: #ffffff;
    }
    input:focus { outline: 2px solid var(--azul); border-color: var(--azul); }
    button {
      margin-top: .8rem;
      cursor: pointer;
      background: var(--azul);
      color: #ffffff;
      border: none;
      border-radius: .4rem;
      font-weight: bold;
    }
    button:hover { background: var(--azul-escuro); }
    button:disabled { opacity: .6; cursor: wait; }
    .aviso { margin: .5rem 0; color: var(--azul-escuro); }
    .aviso.erro { color: #a40000; font-weight: bold; }
    li {
      border: 1px solid #ddd;
      border-left: 4px solid var(--azul);
      border-radius: .4rem;
      padding: .6rem;
      margin-bottom: .5rem;
      list-style: none;
      background: #ffffff;
    }
    ul { padding: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Prato Cheio</h1>
  </header>

  <main>
    <fieldset>
      <legend>Publicar doação</legend>
      <label for="tipo">Tipo de alimento</label>
      <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
      <label for="quantidade">Quantidade</label>
      <input id="quantidade" type="number" min="1" step="1" placeholder="Ex.: 10">
      <label for="unidade">Unidade</label>
      <input id="unidade" placeholder="Ex.: porções, caixas, kg">
      <label for="validade">Validade / retirar até</label>
      <input id="validade" type="date">
      <button id="publicar">Publicar</button>
      <p id="publicar-aviso" class="aviso" aria-live="polite"></p>
    </fieldset>

    <h2>Doações disponíveis</h2>
    <p id="lista-aviso" class="aviso" aria-live="polite"></p>
    <ul id="lista"></ul>

    <h2>Aguardando retirada</h2>
    <p id="aceitas-aviso" class="aviso" aria-live="polite"></p>
    <ul id="aceitas"></ul>

    <h2>Doações coletadas no período</h2>
    <fieldset>
      <legend>Consultar total da ONG</legend>
      <label for="relatorio-ong">ONG</label>
      <input id="relatorio-ong" value="Minha ONG">
      <label for="relatorio-inicio">De</label>
      <input id="relatorio-inicio" type="date">
      <label for="relatorio-fim">Até</label>
      <input id="relatorio-fim" type="date">
      <button id="consultar">Consultar</button>
      <p id="relatorio-resultado" aria-live="polite"></p>
    </fieldset>

    <h2>Estoque da ONG (vigilância sanitária)</h2>
    <fieldset>
      <legend>Consultar doações coletadas pela ONG</legend>
      <label for="estoque-ong">ONG</label>
      <input id="estoque-ong" value="Minha ONG">
      <button id="consultar-estoque">Consultar estoque</button>
      <p id="estoque-resultado" aria-live="polite"></p>
      <ul id="estoque-lista"></ul>
    </fieldset>
  </main>

  <script>
    // Envia uma ação ao servidor e devolve o motivo da recusa, ou null se deu certo.
    // O botão fica desabilitado durante o pedido para não enviar duas vezes.
    async function enviar(botao, url, opcoes) {
      botao.disabled = true;
      try {
        const res = await fetch(url, opcoes);
        if (res.ok) return null;
        const corpo = await res.json().catch(() => ({}));
        return corpo.erro ?? `erro ${res.status}`;
      } catch {
        return 'não foi possível falar com o servidor';
      } finally {
        botao.disabled = false;
      }
    }

    function avisar(id, texto, erro) {
      const aviso = document.getElementById(id);
      aviso.textContent = texto;
      aviso.classList.toggle('erro', erro);
    }

    async function carregar() {
      const res = await fetch('/api/doacoes');
      const doacoes = await res.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação disponível.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo}: ${d.quantidade} ${d.unidade} (até ${d.validade}) `;
        const botao = document.createElement('button');
        botao.textContent = 'Aceitar';
        botao.onclick = async () => {
          const erro = await enviar(botao, `/api/doacoes/${d.id}/aceitar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ong: 'Minha ONG' })
          });
          avisar('lista-aviso', erro ? `Não foi possível aceitar: ${erro}.` : `Doação aceita: ${d.tipo}.`, Boolean(erro));
          carregar();
        };
        li.appendChild(botao);
        lista.appendChild(li);
      }
      carregarAceitas();
    }

    // História 3: o entregador confirma a retirada no local do doador.
    async function carregarAceitas() {
      const res = await fetch('/api/doacoes/aceitas');
      const doacoes = await res.json();
      const lista = document.getElementById('aceitas');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação aguardando retirada.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo}: ${d.quantidade} ${d.unidade} (até ${d.validade}), aceita por ${d.ong} `;
        const botao = document.createElement('button');
        botao.textContent = 'Confirmar retirada';
        botao.onclick = async () => {
          const erro = await enviar(botao, `/api/doacoes/${d.id}/coletar`, { method: 'POST' });
          avisar('aceitas-aviso', erro ? `Não foi possível confirmar a retirada: ${erro}.` : `Retirada confirmada: ${d.tipo}.`, Boolean(erro));
          carregarAceitas();
        };
        li.appendChild(botao);
        lista.appendChild(li);
      }
    }

    // CA 1.2: se a publicação for recusada, informa o motivo e mantém os campos preenchidos.
    document.getElementById('publicar').onclick = async (evento) => {
      const campos = ['tipo', 'quantidade', 'unidade', 'validade'].map((id) => document.getElementById(id));
      const [tipo, quantidade, unidade, validade] = campos;
      const erro = await enviar(evento.currentTarget, '/api/doacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: tipo.value,
          quantidade: quantidade.value,
          unidade: unidade.value,
          validade: validade.value
        })
      });
      if (erro) {
        avisar('publicar-aviso', `Não foi possível publicar: ${erro}.`, true);
        return;
      }
      avisar('publicar-aviso', 'Doação publicada.', false);
      for (const campo of campos) campo.value = '';
      carregar();
    };

    // História 4: o coordenador consulta quantas doações a ONG coletou no período.
    document.getElementById('consultar').onclick = async () => {
      const params = new URLSearchParams({
        ong: document.getElementById('relatorio-ong').value,
        inicio: document.getElementById('relatorio-inicio').value,
        fim: document.getElementById('relatorio-fim').value
      });
      const res = await fetch(`/api/relatorios/coletas?${params}`);
      const corpo = await res.json();
      document.getElementById('relatorio-resultado').textContent = res.ok
        ? `${corpo.ong} coletou ${corpo.total} doação(ões) de ${corpo.inicio} a ${corpo.fim}.`
        : `Não foi possível consultar: ${corpo.erro}.`;
    };

    // História 5: a vigilância sanitária consulta o que a ONG coletou e vê o que já venceu.
    document.getElementById('consultar-estoque').onclick = async () => {
      const params = new URLSearchParams({ ong: document.getElementById('estoque-ong').value });
      const res = await fetch(`/api/relatorios/estoque?${params}`);
      const corpo = await res.json();
      const resultado = document.getElementById('estoque-resultado');
      const lista = document.getElementById('estoque-lista');
      lista.innerHTML = '';
      if (!res.ok) {
        resultado.textContent = `Não foi possível consultar: ${corpo.erro}.`;
        return;
      }
      resultado.textContent = `${corpo.ong} coletou ${corpo.total} doação(ões).`;
      for (const d of corpo.itens) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo}: ${d.quantidade} ${d.unidade} (validade ${d.validade}, coletada em ${d.coletada_em})`;
        if (d.vencida) li.textContent += ' VENCIDA';
        lista.appendChild(li);
      }
    };

    carregar();
  </script>
</body>
</html>
